<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Processador de Texto - Alfabeto Visual Major</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 3rem;
            margin: 0;
            min-height: 100vh;
        }

        h1 { font-size: 1.5rem; font-weight: normal; margin-bottom: 2rem; color: #aaa; text-align: center; }

        input {
            width: 80%;
            max-width: 800px;
            padding: 15px 20px;
            font-size: 1.5rem;
            margin-bottom: 40px;
            background: #2d2d2d;
            border: 2px solid #444;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: #2196F3; }

        #containerTexto {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .espaco-palavra {
            width: 30px;
        }

        svg {
            background-color: #121212;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .linha-grelha { stroke: #2a2a2a; stroke-width: 1; }
        .bloco-consoante { fill: #4CAF50; }
        .linha-vogal { stroke: #2196F3; stroke-width: 4; stroke-linecap: round; }
    </style>
</head>
<body>

    <h1>Escreve texto natural ou números</h1>
    <input type="text" id="inputTexto" placeholder="Ex: Gato 123 Uva" autocomplete="off">
    
    <div id="containerTexto"></div>

    <script>
        const containerTexto = document.getElementById('containerTexto');
        const inputTexto = document.getElementById('inputTexto');
        
        const TAMANHO_CELULA = 20; 
        const COLUNAS = 9;
        const LINHAS = 9;
        const LARGURA_SVG = COLUNAS * TAMANHO_CELULA;
        const ALTURA_SVG = LINHAS * TAMANHO_CELULA;
        
        const posicaoColuna = { 'A': 0, 'E': 1, 'I': 2, 'O': 3, 'U': 4 };

        // 1. MOTOR DE CONVERSÃO FONÉTICA
        function converterTextoParaSistemaMajor(texto) {
            let resultado = texto
                .replace(/[çÇ]/g, '0')
                .toUpperCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');

            resultado = resultado.replaceAll('CH', '6');
            resultado = resultado.replaceAll('LH', '5');
            resultado = resultado.replaceAll('NH', '2');
            resultado = resultado.replaceAll('RR', '4');
            resultado = resultado.replaceAll('Y', 'I');
            // A linha "resultado = resultado.replaceAll('U', 'O');" foi removida para manter a vogal U.

            resultado = resultado.replaceAll('CE', '0E');
            resultado = resultado.replaceAll('CI', '0I');
            resultado = resultado.replaceAll('GE', '6E');
            resultado = resultado.replaceAll('GI', '6I');
        
            const consoantes = {
                'S': '0', 'Z': '0',
                'T': '1', 'D': '1',
                'N': '2',
                'M': '3',
                'R': '4',
                'L': '5',
                'J': '6', 'X': '6',
                'K': '7', 'Q': '7', 'C': '7', 'G': '7',
                'F': '8', 'V': '8',
                'P': '9', 'B': '9'
            };

            let textoConvertido = '';
            for(let i = 0; i < resultado.length; i++) {
                let char = resultado[i];
                if (consoantes[char] !== undefined) {
                    textoConvertido += consoantes[char];
                } else if (/[AEIOU]/.test(char)) {
                    textoConvertido += char;
                } else if (/[0-9]/.test(char)) { 
                    textoConvertido += char;
                }
            }
            return textoConvertido;
        }

        // 2. AGRUPADOR DE SÍLABAS/BLOCOS
        function agruparEmBlocos(textoFonetico) {
            const blocos = [];
            let blocoAtual = { vogaisAnteriores: [], consoante: null, vogaisPosteriores: [] };
            let lendoPosteriores = false;

            for (let i = 0; i < textoFonetico.length; i++) {
                const char = textoFonetico[i];

                if (/[0-9]/.test(char)) {
                    if (blocoAtual.consoante !== null) {
                        blocos.push(blocoAtual);
                        blocoAtual = { vogaisAnteriores: [], consoante: null, vogaisPosteriores: [] };
                    }
                    blocoAtual.consoante = parseInt(char, 10);
                    lendoPosteriores = true;
                } else if (/[AEIOU]/.test(char)) {
                    if (!lendoPosteriores) {
                        blocoAtual.vogaisAnteriores.push(char);
                    } else {
                        blocoAtual.vogaisPosteriores.push(char);
                    }
                }
            }
            
            if (blocoAtual.consoante !== null) {
                blocos.push(blocoAtual);
            }
            return blocos;
        }

        // --- LÓGICA DE DESENHO SVG ---
        function criarElementoSVG(tipo, atributos) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tipo);
            for (let chave in atributos) {
                el.setAttribute(chave, atributos[chave]);
            }
            return el;
        }

        function desenharGrelhaBase(svg) {
            for (let i = 0; i <= COLUNAS; i++) {
                svg.appendChild(criarElementoSVG('line', {
                    x1: i * TAMANHO_CELULA, y1: 0,
                    x2: i * TAMANHO_CELULA, y2: ALTURA_SVG,
                    class: 'linha-grelha'
                }));
            }
            for (let i = 0; i <= LINHAS; i++) {
                svg.appendChild(criarElementoSVG('line', {
                    x1: 0, y1: i * TAMANHO_CELULA,
                    x2: LARGURA_SVG, y2: i * TAMANHO_CELULA,
                    class: 'linha-grelha'
                }));
            }
        }

        function processarVogais(listaVogais) {
            const alturasFinais = { 'A': 0, 'E': 0, 'I': 0, 'O': 0, 'U': 0 };
            listaVogais.forEach((vogal, index) => {
                const v = vogal.toUpperCase();
                if (alturasFinais.hasOwnProperty(v)) {
                    if ((index + 1) > alturasFinais[v]) {
                        alturasFinais[v] = index + 1;
                    }
                }
            });
            return alturasFinais;
        }

        function criarBlocoSvg(dados) {
            const svg = criarElementoSVG('svg', {
                width: LARGURA_SVG,
                height: ALTURA_SVG,
                viewBox: `0 0 ${LARGURA_SVG} ${ALTURA_SVG}`
            });

            desenharGrelhaBase(svg);

            for (let i = 0; i < dados.consoante; i++) {
                svg.appendChild(criarElementoSVG('rect', {
                    x: i * TAMANHO_CELULA,
                    y: 4 * TAMANHO_CELULA,
                    width: TAMANHO_CELULA,
                    height: TAMANHO_CELULA,
                    class: 'bloco-consoante'
                }));
            }

            const alturasAnt = processarVogais(dados.vogaisAnteriores);
            const yOrigemAnt = 4 * TAMANHO_CELULA; 
            for (let vogal in alturasAnt) {
                if (alturasAnt[vogal] > 0) {
                    const x = posicaoColuna[vogal] * TAMANHO_CELULA;
                    svg.appendChild(criarElementoSVG('line', {
                        x1: x, y1: yOrigemAnt,
                        x2: x, y2: yOrigemAnt - (alturasAnt[vogal] * TAMANHO_CELULA),
                        class: 'linha-vogal'
                    }));
                }
            }

            const alturasPost = processarVogais(dados.vogaisPosteriores);
            const yOrigemPost = 5 * TAMANHO_CELULA; 
            for (let vogal in alturasPost) {
                if (alturasPost[vogal] > 0) {
                    const x = posicaoColuna[vogal] * TAMANHO_CELULA;
                    svg.appendChild(criarElementoSVG('line', {
                        x1: x, y1: yOrigemPost,
                        x2: x, y2: yOrigemPost + (alturasPost[vogal] * TAMANHO_CELULA),
                        class: 'linha-vogal'
                    }));
                }
            }

            return svg;
        }

        // --- MOTOR PRINCIPAL ---
        function atualizarTexto() {
            containerTexto.innerHTML = ''; 
            
            const palavras = inputTexto.value.split(/\s+/);

            palavras.forEach((palavra, index) => {
                if (palavra.length > 0) {
                    const textoFonetico = converterTextoParaSistemaMajor(palavra);
                    const blocos = agruparEmBlocos(textoFonetico);

                    blocos.forEach(bloco => {
                        const novoSvg = criarBlocoSvg(bloco);
                        containerTexto.appendChild(novoSvg);
                    });

                    if (index < palavras.length - 1) {
                        const espaco = document.createElement('div');
                        espaco.className = 'espaco-palavra';
                        containerTexto.appendChild(espaco);
                    }
                }
            });
        }

        inputTexto.addEventListener('input', atualizarTexto);
    </script>
</body>
</html>
